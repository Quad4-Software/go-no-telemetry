name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.27.0 or v1.27.0-rc1)"
        required: true
        type: string
      release_type:
        description: "Release channel"
        required: true
        type: choice
        default: stable
        options:
          - stable
          - prerelease

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            HEAD_SHA="$(git rev-parse HEAD)"

            if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "Invalid tag format: $TAG (expected e.g. v1.27.0 or v1.27.0-rc1)" >&2
              exit 1
            fi

            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              EXISTING_SHA="$(git rev-parse "refs/tags/$TAG")"
              if [ "$EXISTING_SHA" != "$HEAD_SHA" ]; then
                echo "Tag $TAG already exists on $EXISTING_SHA, but HEAD is $HEAD_SHA" >&2
                exit 1
              fi
              echo "Tag $TAG already exists on HEAD"
              REF="refs/tags/$TAG"
            else
              REF="$HEAD_SHA"
            fi

            if [ "${{ inputs.release_type }}" = "prerelease" ]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            REF="$GITHUB_REF"
            HEAD_SHA="$(git rev-parse HEAD)"
            case "$TAG" in
              *-rc*|*-beta*|*-alpha*|*-pre*|*-dev*)
                PRERELEASE=true
                ;;
              *)
                PRERELEASE=false
                ;;
            esac
          fi

          {
            echo "tag=$TAG"
            echo "ref=$REF"
            echo "sha=$HEAD_SHA"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { platform: linux-amd64, runner: ubuntu-latest, goos: linux, goarch: amd64, build: bash }
          - { platform: linux-arm64, runner: ubuntu-latest, goos: linux, goarch: arm64, build: bash }
          - { platform: linux-armv6, runner: ubuntu-latest, goos: linux, goarch: arm, goarm: "6", build: bash }
          - { platform: linux-armv7, runner: ubuntu-latest, goos: linux, goarch: arm, goarm: "7", build: bash }
          - { platform: linux-386, runner: ubuntu-latest, goos: linux, goarch: 386, build: bash }
          - { platform: linux-riscv64, runner: ubuntu-latest, goos: linux, goarch: riscv64, build: bash }
          # FreeBSD
          - { platform: freebsd-amd64, runner: ubuntu-latest, goos: freebsd, goarch: amd64, build: bash }
          - { platform: freebsd-arm64, runner: ubuntu-latest, goos: freebsd, goarch: arm64, build: bash }
          - { platform: freebsd-386, runner: ubuntu-latest, goos: freebsd, goarch: 386, build: bash }
          - { platform: freebsd-arm, runner: ubuntu-latest, goos: freebsd, goarch: arm, goarm: "7", build: bash }
          # OpenBSD
          - { platform: openbsd-amd64, runner: ubuntu-latest, goos: openbsd, goarch: amd64, build: bash }
          - { platform: openbsd-arm64, runner: ubuntu-latest, goos: openbsd, goarch: arm64, build: bash }
          - { platform: openbsd-386, runner: ubuntu-latest, goos: openbsd, goarch: 386, build: bash }
          - { platform: openbsd-arm, runner: ubuntu-latest, goos: openbsd, goarch: arm, goarm: "7", build: bash }
          - { platform: openbsd-riscv64, runner: ubuntu-latest, goos: openbsd, goarch: riscv64, build: bash }
          # NetBSD
          - { platform: netbsd-amd64, runner: ubuntu-latest, goos: netbsd, goarch: amd64, build: bash }
          - { platform: netbsd-arm64, runner: ubuntu-latest, goos: netbsd, goarch: arm64, build: bash }
          - { platform: netbsd-386, runner: ubuntu-latest, goos: netbsd, goarch: 386, build: bash }
          - { platform: netbsd-arm, runner: ubuntu-latest, goos: netbsd, goarch: arm, goarm: "7", build: bash }
          # DragonFly BSD
          - { platform: dragonfly-amd64, runner: ubuntu-latest, goos: dragonfly, goarch: amd64, build: bash }
          # macOS (native toolchains required)
          - { platform: darwin-amd64, runner: macos-15-intel, goos: darwin, goarch: amd64, build: bash }
          - { platform: darwin-arm64, runner: macos-15, goos: darwin, goarch: arm64, build: bash }
          # Windows
          - { platform: windows-amd64, runner: windows-latest, goos: windows, goarch: amd64, build: bat }
          - { platform: windows-arm64, runner: windows-latest, goos: windows, goarch: arm64, build: bat }
          - { platform: windows-386, runner: windows-latest, goos: windows, goarch: 386, build: bat }

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.build == 'bash'
        with:
          go-version: "1.24.6"
          cache: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.build == 'bat'
        with:
          go-version: "1.24.6"
          cache: false

      - name: Set release version
        shell: bash
        run: |
          VER="go${TAG#v}"
          printf '%s\n' "$VER" > VERSION
          printf 'time %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> VERSION

      - name: Build and pack (Unix)
        if: matrix.build == 'bash'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          PLATFORM: ${{ matrix.platform }}
          GOTOOLCHAIN: local
        run: |
          cd src
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOOS="$GOOS"
          export GOARCH="$GOARCH"
          if [ -n "${GOARM:-}" ]; then export GOARM="$GOARM"; fi
          ./make.bash -distpack
          ../bin/go version
          test "$(../bin/go telemetry)" = "off"

      - name: Build and pack (Windows)
        if: matrix.build == 'bat'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PLATFORM: ${{ matrix.platform }}
          GOTOOLCHAIN: local
        run: |
          cd src
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOOS="$GOOS"
          export GOARCH="$GOARCH"
          cmd //c "call make.bat -distpack"
          ../bin/go version
          test "$(../bin/go telemetry)" = "off"

      - name: Package artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "$TAG"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

      - name: Upload source tarball
        if: matrix.platform == 'linux-amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-src
          path: release/go-no-telemtry-${{ env.TAG }}.src.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          SHA="${{ needs.prepare.outputs.sha }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'go-no-telemtry-*' -o -name 'SHA256SUMS' \) -exec cp {} release/ \;
          cd release
          sha256sum go-no-telemtry-* > SHA256SUMS
          ls -la

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: go-no-telemtry ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          files: release/*
